# Machine-specific browser entries for /home/myuser/.codex/config.toml.
# Merge these sections; preserve unrelated Codex settings.

[mcp_servers.playwright]
command = "/home/myuser/.local/share/mise/installs/node/latest/bin/node"
args = ["/home/myuser/.local/share/codex-browser-tools/node_modules/@playwright/mcp/cli.js", "--executable-path", "/usr/local/bin/chromium", "--sandbox", "--user-data-dir", "/home/myuser/.local/share/codex-browser-tools/profiles/playwright"]

[mcp_servers.playwright.env]
DISPLAY = ":0"
WAYLAND_DISPLAY = "wayland-1"
XDG_RUNTIME_DIR = "/run/user/1001"

[mcp_servers.chrome-devtools]
command = "/home/myuser/.local/share/mise/installs/node/latest/bin/node"
args = ["/home/myuser/.local/share/codex-browser-tools/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js", "--executablePath=/usr/local/bin/chromium", "--user-data-dir=/home/myuser/.local/share/codex-browser-tools/profiles/chrome-devtools", "--no-usage-statistics", "--no-performance-crux", "--no-page-id-routing"]

[mcp_servers.chrome-devtools.env]
DISPLAY = ":0"
WAYLAND_DISPLAY = "wayland-1"
XDG_RUNTIME_DIR = "/run/user/1001"
CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS = "1"
